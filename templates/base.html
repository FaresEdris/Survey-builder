<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Survey App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/surveys.css') }}">
</head>

<body>
    <header class="site-header">
        <nav class="navbar">
            <div class="nav-left">
                <h1><a href="{{ url_for('index') }}">Survey App</a></h1>

                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('survey.view_surveys') }}">View Surveys</a>

                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('survey.view_create_survey') }}">Create Survey</a>
                    <a href="{{ url_for('survey_control.view_all_responses') }}">Responses</a>
                {% endif %}
            </div>

            <div class="nav-right">
                {% if current_user.is_authenticated %}
                    <span>Welcome, {{ current_user.username }}!</span>
                    <a href="{{ url_for('auth.logout') }}">Logout</a>
                {% else %}
                    <a href="{{ url_for('auth.login') }}">Login</a>
                    <a href="{{ url_for('auth.register') }}">Register</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
