{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 400px; margin: 50px auto; text-align: center;">
    <h2>Register</h2>
    <form method="POST" action="{{ url_for('auth.register') }}">
        <div style="margin-bottom: 15px;">
            <label for="username">Username:</label><br>
            <input type="text" name="username" id="username" required style="width: 100%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label for="password">Password:</label><br>
            <input type="password" name="password" id="password" required style="width: 100%; padding: 8px;">
        </div>
        <button type="submit" style="padding: 10px 20px;">Register</button>
    </form>

    <p style="margin-top: 10px;">
        Already have an account?
        <a href="{{ url_for('auth.login') }}">Login here</a>
    </p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color: red; list-style: none; padding: 0;">
          {% for msg in messages %}
            <li>{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
</div>
{% endblock %}
