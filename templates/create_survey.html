{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Create a New Survey</h2>

    <form id="createSurveyForm">
        <!-- Survey Info -->
        <label for="title">Survey Title:</label>
        <input type="text" id="title" name="title" required>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required rows="4"></textarea>

        <!-- Questions container -->
        <div id="questions"></div>

        <button type="button" class="btn primary" id="addQuestionBtn">Add Question</button>

        <div style="margin-top:20px;">
            <button type="button" class="btn primary" id="submitSurveyBtn">Publish Survey</button>
        </div>
    </form>
</div>
<script src="{{ url_for('static', filename='js/create_survey.js') }}"></script>
{% endblock %}
