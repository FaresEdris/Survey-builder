{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Edit Survey</h2>

    <form id="editSurveyForm">
        <!-- Survey Info -->
        <label for="title">Survey Title:</label>
        <input type="text" id="title" name="title" value="{{ survey.title }}" required>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required rows="4">{{ survey.description }}</textarea>

        <!-- Questions container -->
        <div id="questions"></div>

        <button type="button" class="btn primary" id="addQuestionBtn">Add Question</button>

        <div style="margin-top:20px;">
            <button type="button" class="btn primary" id="submitSurveyBtn">Save Changes</button>
        </div>
    </form>
</div>

<!-- Pass survey data to JS -->
<script>
const surveyData = JSON.parse('{{ survey | tojson | safe }}');
</script>
<script src="{{ url_for('static', filename='js/survey_edit.js') }}"></script>
{% endblock %}
