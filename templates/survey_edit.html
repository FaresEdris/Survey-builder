{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Edit Survey</h2>

    <form id="editSurveyForm" class="needs-validation" novalidate>
        
        <div class="mb-3">
            <label for="title" class="form-label">Survey Title</label>
            <input type="text" class="form-control" id="title" name="title" 
                   value="{{ survey.title }}" required>
            <div class="invalid-feedback">Title is required.</div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" 
                      rows="4" required>{{ survey.description }}</textarea>
            <div class="invalid-feedback">Description is required.</div>
        </div>

        <div id="questions" class="mb-4"></div>

        <button type="button" class="btn btn-outline-primary mb-3" id="addQuestionBtn">
            + Add Question
        </button>

        <div>
            <button type="button" class="btn btn-primary" id="submitSurveyBtn">
                Save Changes
            </button>
        </div>

    </form>
</div>

<script>
    const surveyData = JSON.parse('{{ survey | tojson | safe }}');
</script>

<script src="{{ url_for('static', filename='js/survey_edit.js') }}"></script>
{% endblock %}
