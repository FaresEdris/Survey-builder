{% extends "base.html" %}
{% block content %}

<h2>Edit Survey</h2>

<form method="POST">

    <!-- Title -->
    <label>Title</label>
    <input type="text" name="title" value="{{ survey.title }}" style="width:100%" required>

    <!-- Description -->
    <label>Description</label>
    <textarea name="description" style="width:100%" rows="3">{{ survey.description }}</textarea>

    <h3>Questions</h3>

    {% for q in survey.questions if not q.deleted %}
    <div style="border:1px solid #ddd; padding:10px; margin:10px 0">

        <strong>Question {{ loop.index }} ({{ q.type }})</strong><br>

        <!-- text -->
        <input type="text" name="text_{{ q.id }}" value="{{ q.text }}" style="width:100%">

        <!-- required -->
        <label>
            <input type="checkbox" name="required_{{ q.id }}" {% if q.required %}checked{% endif %}>
            Required
        </label>
        <br>

        <!-- options -->
        {% if q.type != 'text' %}
        <label>Options (comma separated)</label>
        <input type="text" name="options_{{ q.id }}" 
               value="{{ q.options | join(', ') }}" style="width:100%">
        {% endif %}

        <label>
            <input type="checkbox" name="delete_{{ q.id }}">
            Delete this question
        </label>

    </div>
    {% endfor %}

    <h3>Add New Questions</h3>

    {% for i in range(3) %}
    <div style="border:1px dashed #aaa; padding:10px; margin-bottom:8px">

        <input type="text" name="new_text" placeholder="Question text" style="width:100%">

        <select name="new_type">
            <option value="text">Text</option>
            <option value="multiple">Multiple choice</option>
            <option value="checkbox">Checkbox</option>
        </select>

        <input type="text" name="new_options"
               placeholder="opt1, opt2, opt3 (only for MCQ)"
               style="width:100%">

    </div>
    {% endfor %}

    <button type="submit">Save</button>
    <a href="{{ url_for('survey_control.survey_control_page', survey_id=survey.id) }}">Cancel</a>

</form>

{% endblock %}
